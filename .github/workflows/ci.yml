name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install bridge dependency
        run: python -m pip install -r requirements.txt
      - name: Python transport and local tools
        run: python -m unittest discover -s tests -v
      - name: Command parser
        run: node extension/test-parser.js
      - name: Provider document reading
        run: node extension/test-chatgpt.js
      - name: Worker permissions and routing
        run: node extension/test-worker.js
      - name: Approval dialog
        run: node extension/test-approval.js
      - name: Shared agent loop
        run: node extension/test-loop.js
