name: Feature request
description: Suggest a concrete improvement to FreeAgent.
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Give an example and explain the user benefit.
    validations:
      required: true
  - type: textarea
    id: considerations
    attributes:
      label: Permissions and alternatives
      description: Mention extra access needed or the current workaround.
